<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrumaTaxi — Agenda de Transfers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mist-50:#F7EEDF; --mist-100:#EFE1C4; --mist-200:#E2CFA3;
    --slate-900:#12314E; --slate-600:#5B6B7E;
    --amber-600:#C08830; --amber-700:#A6742A;
    --sage-600:#12314E; --sage-100:#E6EAF0;
    --clay-500:#B0654A; --clay-100:#F3E3D6;
    --white:#FFFDF9; --radius:12px; --border:1px solid var(--mist-200);
    --font-serif:'Poppins', sans-serif; --font-sans:'Work Sans', sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--mist-50); color:var(--slate-900); font-family:var(--font-sans); -webkit-font-smoothing:antialiased; }
  .app { max-width:520px; margin:0 auto; padding:24px 16px 48px; }

  .app-header { padding-bottom:14px; border-bottom:var(--border); margin-bottom:22px; text-align:center; }
  .logo-img { max-width:200px; width:65%; height:auto; margin:0 auto; display:block; }
  .tagline { margin:4px 0 0; font-size:13px; color:var(--slate-600); font-family:var(--font-serif); font-style:italic; }
  .storage-note { margin-top:10px; font-size:11.5px; color:var(--slate-600); background:var(--mist-100); border-radius:8px; padding:8px 10px; line-height:1.4; }

  .month-nav { display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:12px; }
  .month-nav button { width:32px; height:32px; border-radius:50%; border:1px solid var(--mist-200); background:var(--white); color:var(--amber-700); font-size:18px; cursor:pointer; }
  .month-nav button:hover { background:var(--mist-100); }
  .month-nav span { font-family:var(--font-serif); font-size:15px; font-weight:600; text-transform:capitalize; min-width:150px; text-align:center; }
  .search-input { width:100%; font-family:var(--font-sans); font-size:15px; padding:10px 12px; border:1px solid var(--mist-200); border-radius:8px; background:var(--white); color:var(--slate-900); margin-bottom:14px; }
  .search-input:focus { outline:2px solid var(--amber-600); outline-offset:1px; border-color:var(--amber-600); }
  .stats { display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap; }
  .stat { flex:1; min-width:100px; background:var(--white); border:var(--border); border-radius:var(--radius); padding:12px 14px; }
  .stat-value { font-family:var(--font-serif); font-size:21px; font-weight:600; line-height:1.2; }
  .stat-label { font-size:11.5px; color:var(--slate-600); margin-top:3px; }

  .toggle-form { width:100%; text-align:left; background:var(--white); border:var(--border); border-radius:var(--radius); padding:14px 16px; font-family:var(--font-sans); font-size:15px; font-weight:600; color:var(--amber-700); cursor:pointer; }
  .toggle-form:hover { border-color:var(--amber-600); }

  .booking-form { margin-top:10px; background:var(--white); border:var(--border); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:14px; }
  .hidden { display:none !important; }

  .field { display:flex; flex-direction:column; gap:4px; flex:1; }
  .field label { font-size:12px; color:var(--slate-600); }
  .field input { font-family:var(--font-sans); font-size:15px; padding:9px 10px; border:1px solid var(--mist-200); border-radius:8px; background:var(--mist-50); color:var(--slate-900); width:100%; }
  .field input:focus { outline:2px solid var(--amber-600); outline-offset:1px; border-color:var(--amber-600); }
  .field textarea { font-family:var(--font-sans); font-size:14px; padding:9px 10px; border:1px solid var(--mist-200); border-radius:8px; background:var(--mist-50); color:var(--slate-900); width:100%; resize:vertical; line-height:1.5; }
  .field textarea:focus { outline:2px solid var(--amber-600); outline-offset:1px; border-color:var(--amber-600); }
  .field select { font-family:var(--font-sans); font-size:15px; padding:9px 10px; border:1px solid var(--mist-200); border-radius:8px; background:var(--mist-50); color:var(--slate-900); width:100%; }
  .field-row { display:flex; gap:10px; }

  .tipo-selector { display:flex; gap:8px; flex-wrap:wrap; }
  .tipo-pill { flex:1; min-width:120px; padding:10px 8px; border-radius:8px; border:1px solid var(--mist-200); background:var(--mist-50); color:var(--slate-600); font-family:var(--font-sans); font-size:12.5px; font-weight:600; cursor:pointer; text-align:center; }
  .tipo-pill.active { background:var(--amber-600); border-color:var(--amber-600); color:var(--white); }
  .pagamento-pill { flex:1; min-width:120px; padding:10px 8px; border-radius:8px; border:1px solid var(--mist-200); background:var(--mist-50); color:var(--slate-600); font-family:var(--font-sans); font-size:12.5px; font-weight:600; cursor:pointer; text-align:center; }
  .pagamento-pill.active { background:var(--amber-600); border-color:var(--amber-600); color:var(--white); }

  .transfer-fieldset { border:1px dashed var(--mist-200); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .fieldset-title { font-family:var(--font-serif); font-size:14.5px; font-weight:600; color:var(--slate-900); }

  .form-actions { display:flex; gap:10px; margin-top:2px; }
  .btn-primary { flex:1; background:var(--amber-600); color:var(--white); border:none; border-radius:8px; padding:12px; font-size:15px; font-weight:600; cursor:pointer; font-family:var(--font-sans); }
  .btn-primary:hover { background:var(--amber-700); }
  .btn-ghost { background:none; border:1px solid var(--mist-200); border-radius:8px; padding:11px 14px; cursor:pointer; color:var(--slate-600); font-family:var(--font-sans); font-size:14px; }

  .section-title { font-family:var(--font-serif); font-size:18px; font-weight:600; margin:30px 0 12px; }

  .agenda-list { display:flex; flex-direction:column; gap:10px; }
  .empty-state { color:var(--slate-600); font-size:14px; background:var(--white); border:1px dashed var(--mist-200); border-radius:var(--radius); padding:22px; text-align:center; }

  .date-group-label { font-size:12px; color:var(--slate-600); margin:16px 0 4px; }
  .date-group-label:first-child { margin-top:0; }

  .booking-card { background:var(--white); border:var(--border); border-left:3px solid var(--mist-200); border-radius:var(--radius); padding:14px; }
  .booking-card.status-pendente { border-left-color:var(--clay-500); }
  .booking-card.status-confirmado { border-left-color:var(--sage-600); }
  .booking-card.status-concluido { border-left-color:var(--mist-200); opacity:0.85; }

  .card-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .card-tipo { font-family:var(--font-serif); font-size:14.5px; font-weight:600; }
  .card-status { font-size:11.5px; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .card-status.pendente { background:var(--clay-100); color:var(--clay-500); }
  .card-status.confirmado { background:var(--sage-100); color:var(--sage-600); }
  .card-status.concluido { background:var(--mist-100); color:var(--slate-600); }

  .card-client { font-size:15px; font-weight:600; margin-top:5px; }
  .card-leg { font-size:13px; color:var(--slate-600); margin-top:4px; line-height:1.4; }
  .card-leg b { color:var(--slate-900); font-weight:600; }
  .card-obs { font-size:12px; color:var(--slate-600); margin-top:4px; font-style:italic; }

  .card-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .card-actions button { font-family:var(--font-sans); font-size:12.5px; padding:7px 11px; border-radius:7px; cursor:pointer; border:1px solid var(--mist-200); background:var(--mist-50); color:var(--slate-900); }
  .whatsapp-btn { border-color:var(--sage-600) !important; color:var(--sage-600) !important; background:var(--white) !important; font-weight:600; }
  .whatsapp-btn:hover { background:var(--sage-100) !important; }
  .danger-btn { color:var(--clay-500) !important; border-color:var(--clay-100) !important; }
  .save-btn { border-color:var(--amber-600) !important; color:var(--amber-700) !important; background:var(--white) !important; font-weight:600; }
  .driver-section { margin-top:12px; padding-top:12px; border-top:1px dashed var(--mist-200); }
  .card-hint { font-size:11px; color:var(--slate-600); margin-top:7px; }

  .toggle-done { width:100%; text-align:left; background:none; border:none; padding:8px 0; color:var(--slate-600); font-size:13px; cursor:pointer; font-family:var(--font-sans); }

  .app-footer { text-align:center; margin-top:36px; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .btn-text-muted { background:none; border:none; color:var(--slate-600); font-size:12px; cursor:pointer; text-decoration:underline; font-family:var(--font-sans); }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--slate-900); color:var(--white); padding:10px 18px; border-radius:8px; font-size:13px; box-shadow:0 6px 18px rgba(0,0,0,.22); z-index:10; max-width:90%; text-align:center; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

          <div class="field"><label for="outOrigem">Origem</label><input type="text" id="outOrigem" value="Clara Arte Resort"></div>
          <div class="field"><label for="outDestino">Destino</label><input type="text" id="outDestino" value="Aeroporto de Confins (CNF)"></div>

        <div class="field-row">
          <div class="field"><label for="outPassageiros">Passageiros</label><input type="text" id="outPassageiros" placeholder="Quantidade ou nomes"></div>
          <div class="field"><label for="outVeiculo">Veículo</label><input type="text" id="outVeiculo" placeholder="Ex: Executivo, Van"></div>

      <div class="field-row">

        <label>Forma de pagamento</label>
        <div class="tipo-selector" id="pagamentoSelector">

          <button type="button" class="pagamento-pill" data-pagamento="Cartão de Débito">Cartão de Débito</button>
          <button type="button" class="pagamento-pill" data-pagamento="Pix">Pix</button>

        <input type="text" id="obs" placeholder="Bagagem, criança de colo, etc.">

      <div class="form-actions">
        <button type="submit" class="btn-primary" id="submitBtn">Salvar agendamento</button>
        <button type="button" class="btn-ghost hidden" id="cancelEditBtn">Cancelar edição</button>

      <div class="field">
        <label for="cfgNome">Nome de quem assina as mensagens</label>
        <input type="text" id="cfgNome">
      </div>
      <div class="field">
        <label for="cfgEmpresa">Assinatura da empresa</label>
        <input type="text" id="cfgEmpresa">
      </div>
      <div class="field">
        <label for="cfgFechamento">Texto de encerramento da mensagem de confirmação</label>
        <textarea id="cfgFechamento" rows="6"></textarea>
      </div>
      <div class="field">
        <label for="cfgScriptURL">URL do Google Apps Script (sincroniza com sua planilha)</label>
        <input type="text" id="cfgScriptURL" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <div class="form-actions">
        <button type="button" class="btn-primary" id="saveSettingsBtn">Salvar configurações</button>
        <button type="button" class="btn-ghost" id="syncAgoraBtn">🔄 Sincronizar agora</button>
      </div>
    </div>

  <section class="agenda">
    <h2 class="section-title">Agenda</h2>
    <input type="text" id="buscaCliente" class="search-input" placeholder="🔍 Buscar por nome ou WhatsApp do cliente...">
    <div id="agendaList" class="agenda-list">Carregando agenda…</div>
  </section>


  <section id="doneSection" class="hidden">
    <button class="toggle-done" id="toggleDoneBtn" type="button">Corridas concluídas ▾</button>
    <div id="doneList" class="agenda-list hidden"></div>

    <button id="exportBtn" class="btn-text-muted" type="button">Exportar backup (.json)</button>
    <button id="importBtn" class="btn-text-muted" type="button">Importar backup</button>
    <input type="file" id="importFile" accept="application/json" class="hidden">
    <button id="resetBtn" class="btn-text-muted" type="button">Apagar todos os dados</button>
  </footer>

<div id="toast" class="toast hidden"></div>

<script>
  const STORAGE_KEY = 'brumataxi_agendamentos';
  let bookings = [];
  let editingId = null;
  let tipoSelecionado = 'both';
  let motoristaFormOpenId = null;

  const MOTORISTAS_KEY = 'brumataxi_motoristas';
  let motoristas = [];

  function loadMotoristas() {
    try {
      const raw = localStorage.getItem(MOTORISTAS_KEY);
      motoristas = raw ? JSON.parse(raw) : [];
    } catch (e) { motoristas = []; }
    renderMotoristasList();
  }

  function saveMotoristas() {
    try {
      localStorage.setItem(MOTORISTAS_KEY, JSON.stringify(motoristas));
      syncParaNuvem();
    } catch (e) {
      showToast('Não foi possível salvar o cadastro de motoristas agora.');
    }
  }

  function renderMotoristasList() {
    const list = document.getElementById('driversList');
    list.innerHTML = '';
    if (motoristas.length === 0) {
      const vazio = document.createElement('div'); vazio.className = 'card-leg';
      vazio.textContent = 'Nenhum motorista cadastrado ainda.';
      list.appendChild(vazio);
      return;
    }
    motoristas.forEach(m => {
      const row = document.createElement('div'); row.className = 'card-leg';
      row.innerHTML = `<b>${m.nome}</b> — ${m.telefone}${m.veiculo ? ' · ' + m.veiculo : ''}${m.placa ? ' · placa ' + m.placa : ''}`;
      const del = makeButton('Remover', 'danger-btn', () => {
        motoristas = motoristas.filter(x => x.id !== m.id);
        saveMotoristas();
        renderMotoristasList();
      });
      del.style.marginLeft = '8px';
      row.appendChild(del);
      list.appendChild(row);
    });
  }

  function addMotoristaCadastro() {
    const nome = document.getElementById('novoMotoristaNome').value.trim();
    const telefone = document.getElementById('novoMotoristaTelefone').value.trim();
    const veiculo = document.getElementById('novoMotoristaVeiculo').value.trim();
    const placa = document.getElementById('novoMotoristaPlaca').value.trim();
    if (!nome || !telefone) { showToast('Preencha nome e WhatsApp do motorista.'); return; }
    motoristas.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), nome, telefone, veiculo, placa });
    saveMotoristas();
    renderMotoristasList();
    document.getElementById('novoMotoristaNome').value = '';
    document.getElementById('novoMotoristaTelefone').value = '';
    document.getElementById('novoMotoristaVeiculo').value = '';
    document.getElementById('novoMotoristaPlaca').value = '';
    showToast('Motorista cadastrado.');
  }

  const SCRIPT_URL_KEY = 'brumataxi_script_url';
  let scriptURL = localStorage.getItem(SCRIPT_URL_KEY) || '';

  const CONFIG_KEY = 'brumataxi_config';
  let config = {
    assinaturaNome: 'Juan Mateus',
    assinaturaEmpresa: 'BrumaTaxi • Transporte Executivo',
    textoFechamentoConfirmacao: 'Caso precise de algum ajuste ou apoio, estarei à disposição.\n\nDesejamos uma excelente viagem!\n\nO motorista estará pontualmente à disposição no horário combinado.'
  };

  function loadConfig() {
    try {
      const raw = localStorage.getItem(CONFIG_KEY);
      if (raw) Object.assign(config, JSON.parse(raw));
    } catch (e) { /* mantém os valores padrão */ }
    document.getElementById('cfgNome').value = config.assinaturaNome;
    document.getElementById('cfgEmpresa').value = config.assinaturaEmpresa;
    document.getElementById('cfgFechamento').value = config.textoFechamentoConfirmacao;
    document.getElementById('cfgScriptURL').value = scriptURL;
  }

  async function saveConfig() {
    const novaScriptURL = document.getElementById('cfgScriptURL').value.trim();
    const urlMudou = novaScriptURL !== scriptURL;
    config.assinaturaNome = document.getElementById('cfgNome').value.trim() || 'Juan Mateus';
    config.assinaturaEmpresa = document.getElementById('cfgEmpresa').value.trim() || 'BrumaTaxi • Transporte Executivo';
    config.textoFechamentoConfirmacao = document.getElementById('cfgFechamento').value.replace(/\n+$/, '');
    scriptURL = novaScriptURL;
    try {
      localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
      localStorage.setItem(SCRIPT_URL_KEY, scriptURL);
      if (urlMudou && scriptURL) {
        showToast('Conectando à planilha e buscando o que já está lá...');
        const achou = await carregarDaNuvem(false);
        showToast(achou ? 'Conectado! Dados da planilha carregados.' : 'Conectado, mas a planilha ainda está vazia.');
      } else {
        showToast('Configurações salvas.');
        syncParaNuvem();
      }
    } catch (e) {
      showToast('Não foi possível salvar as configurações agora.');
    }
  }

  async function syncParaNuvem() {
    if (!scriptURL) return;
    try {
      await fetch(scriptURL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ bookings, motoristas, config })
      });
    } catch (e) {
      console.warn('Não foi possível sincronizar com a planilha agora.', e);
    }
  }

  async function carregarDaNuvem(manual) {
    if (!scriptURL) {
      if (manual) showToast('Cadastre a URL do Google Apps Script antes de sincronizar.');
      return false;
    }
    try {
      const res = await fetch(scriptURL);
      const dados = await res.json();
      if (dados && Array.isArray(dados.bookings)) {
        bookings = dados.bookings;
        motoristas = dados.motoristas || [];
        Object.assign(config, dados.config || {});
        localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
        localStorage.setItem(MOTORISTAS_KEY, JSON.stringify(motoristas));
        localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
        render();
        renderMotoristasList();
        if (manual) showToast('Dados atualizados da planilha.');
        return true;
      }
    } catch (e) {
      console.warn('Não foi possível carregar da planilha agora.', e);
      if (manual) showToast('Não foi possível conectar à planilha agora.');
    }
    return false;
  }

  function loadBookings() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      bookings = raw ? JSON.parse(raw) : [];
    } catch (e) {
      bookings = [];
    }
    render();
  }

  function saveBookings() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
      syncParaNuvem();
    } catch (e) {
      showToast('Não foi possível salvar agora. O navegador pode estar sem espaço.');
    }
  }

  function cleanPhone(raw) {
    let digits = raw.replace(/\D/g, '');
    if (digits.length === 10 || digits.length === 11) digits = '55' + digits;
    return digits;
  }

  function buildWhatsAppLink(b, message) {
    return `https://wa.me/${cleanPhone(b.telefone)}?text=${encodeURIComponent(message)}`;
  }

  function waLink(phone, message) {
    return `https://wa.me/${cleanPhone(phone)}?text=${encodeURIComponent(message)}`;
  }

  function formatDateFull(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function formatDateLabel(dateStr) {
    if (!dateStr) return 'Data não definida';
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const d = new Date(dateStr + 'T00:00:00');
    const diffDays = Math.round((d - today) / 86400000);
    if (diffDays === 0) return 'Hoje · ' + d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });
    if (diffDays === 1) return 'Amanhã · ' + d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });
    return d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function buildTransferMessage(b) {
    const parts = [];
    parts.push('*Confirmação de Agendamento de Transfer*');
    parts.push(`*Cliente:* ${b.nome}`);
    if (b.in) {
      parts.push('*Transfer In*');
      parts.push(
        `Data: ${formatDateFull(b.in.data)}\n` +
        `Voo: ${b.in.voo || ''}\n` +
        `Horário previsto de chegada: ${b.in.horaChegada || ''}\n` +
        `Origem: ${b.in.origem || ''}\n` +
        `Destino: ${b.in.destino || ''}\n` +
        `Passageiros: ${b.in.passageiros || ''}\n` +
        `Veículo: ${b.in.veiculo || ''}`
      );
    }
    if (b.out) {
      parts.push('*Transfer Out*');
      parts.push(
        `Data: ${formatDateFull(b.out.data)}\n` +
        `Origem: ${b.out.origem || ''}\n` +
        `Destino: ${b.out.destino || ''}\n` +
        `Horário de saída: ${b.out.horaSaida || ''}\n` +
        `Voo: ${b.out.voo || ''}\n` +
        `Passageiros: ${b.out.passageiros || ''}\n` +
        `Veículo: ${b.out.veiculo || ''}`
      );
    }
    if (b.formaPagamento) parts.push(`Forma de pagamento combinada: ${b.formaPagamento}`);
    parts.push(config.textoFechamentoConfirmacao);
    parts.push(`Com carinho,\n${config.assinaturaNome}\n*${config.assinaturaEmpresa}*`);
    return parts.join('\n\n');
  }

  function reminderMessage(b) {
    const linhas = [];
    if (b.in) linhas.push(`Transfer In: ${formatDateFull(b.in.data)} às ${b.in.horaChegada || 'horário a confirmar'} (voo ${b.in.voo || 'a confirmar'})`);
    if (b.out) linhas.push(`Transfer Out: ${formatDateFull(b.out.data)} às ${b.out.horaSaida || 'horário a confirmar'} (voo ${b.out.voo || 'a confirmar'})`);
    return `Olá, ${b.nome}! Passando para lembrar do seu transfer com a BrumaTaxi:\n\n${linhas.join('\n')}\n\nEstaremos à disposição no horário combinado.\n\nCom carinho,\n${config.assinaturaNome}`;
  }

  function reviewMessage(b) {
    return `Olá, ${b.nome}! Esperamos que sua viagem com a BrumaTaxi tenha sido tranquila. Se puder, deixe sua avaliação — isso nos ajuda muito a melhorar:\n\nhttps://g.page/r/CeSpJKLSyL0ZEBE/review\n\nObrigado pela confiança!\n\nCom carinho,\n${config.assinaturaNome}\n*${config.assinaturaEmpresa}*`;
  }

  function buildDriverInfoForClientMessage(b) {
    const parts = [];
    parts.push(`Olá, ${b.nome}! Seu motorista para o transfer já está definido:`);
    let dados = `*Motorista:* ${b.motorista.nome}\n*Contato:* ${b.motorista.telefone}`;
    if (b.motorista.veiculo) dados += `\n*Veículo:* ${b.motorista.veiculo}`;
    if (b.motorista.placa) dados += `\n*Placa:* ${b.motorista.placa}`;
    parts.push(dados);
    parts.push('Ele(a) estará no local combinado no horário previsto. Qualquer dúvida, estou à disposição.');
    parts.push(`Com carinho,\n${config.assinaturaNome}\n*${config.assinaturaEmpresa}*`);
    return parts.join('\n\n');
  }

  function buildRideInfoForDriverMessage(b) {
    const parts = [];
    parts.push(`Olá, ${b.motorista.nome}! Segue os dados da corrida:`);
    parts.push(`*Cliente:* ${b.nome}\n*Telefone do cliente:* ${b.telefone}`);
    if (b.in) {
      parts.push('*Transfer In*');
      parts.push(
        `Data: ${formatDateFull(b.in.data)}\n` +
        `Voo: ${b.in.voo || ''}\n` +
        `Horário previsto de chegada: ${b.in.horaChegada || ''}\n` +
        `Origem: ${b.in.origem || ''}\n` +
        `Destino: ${b.in.destino || ''}\n` +
        `Passageiros: ${b.in.passageiros || ''}`
      );
    }
    if (b.out) {
      parts.push('*Transfer Out*');
      parts.push(
        `Data: ${formatDateFull(b.out.data)}\n` +
        `Origem: ${b.out.origem || ''}\n` +
        `Destino: ${b.out.destino || ''}\n` +
        `Horário de saída: ${b.out.horaSaida || ''}\n` +
        `Voo: ${b.out.voo || ''}\n` +
        `Passageiros: ${b.out.passageiros || ''}`
      );
    }
    if (b.obs) parts.push(`Observações: ${b.obs}`);
    if (b.motorista.valorReceber) parts.push(`*Valor a receber do cliente:* R$ ${Number(b.motorista.valorReceber).toFixed(2).replace('.', ',')}`);
    if (b.motorista.valorLivre) parts.push(`*Valor livre:* R$ ${Number(b.motorista.valorLivre).toFixed(2).replace('.', ',')}`);
    parts.push('Qualquer imprevisto, me avisa. Obrigado!');
    return parts.join('\n\n');
  }

  function sendDriverInfoToClient(id) {
    const b = bookings.find(x => x.id === id);
    if (!b || !b.motorista) return;
    window.open(buildWhatsAppLink(b, buildDriverInfoForClientMessage(b)), '_blank');
    showToast('Mensagem para o cliente pronta.');
  }

  function sendRideToDriver(id) {
    const b = bookings.find(x => x.id === id);
    if (!b || !b.motorista) return;
    window.open(waLink(b.motorista.telefone, buildRideInfoForDriverMessage(b)), '_blank');
    showToast('Mensagem para o motorista pronta.');
  }

  function openDriverForm(id) {
    motoristaFormOpenId = id;
    render();
  }

  function cancelDriverForm() {
    motoristaFormOpenId = null;
    render();
  }

  function saveMotorista(id) {
    const b = bookings.find(x => x.id === id);
    if (!b) return;
    const nome = document.getElementById('driverNomeInput').value.trim();
    const telefone = document.getElementById('driverTelefoneInput').value.trim();
    const veiculo = document.getElementById('driverVeiculoInput').value.trim();
    const placa = document.getElementById('driverPlacaInput').value.trim();
    const valorReceber = document.getElementById('driverValorReceberInput').value;
    const valorLivre = document.getElementById('driverValorLivreInput').value;
    if (!nome || !telefone) { showToast('Preencha nome e WhatsApp do motorista.'); return; }
    b.motorista = { nome, telefone, veiculo, placa, valorReceber, valorLivre };
    motoristaFormOpenId = null;
    saveBookings();
    render();
    showToast('Motorista atribuído.');
  }

  function preencherMotoristaSelecionado(selectId) {
    const id = document.getElementById(selectId).value;
    if (!id) return;
    const m = motoristas.find(x => x.id === id);
    if (!m) return;
    document.getElementById('driverNomeInput').value = m.nome;
    document.getElementById('driverTelefoneInput').value = m.telefone;
    document.getElementById('driverVeiculoInput').value = m.veiculo || '';
    document.getElementById('driverPlacaInput').value = m.placa || '';
  }

  function buildDriverForm(b) {
    const wrap = document.createElement('div');
    wrap.className = 'transfer-fieldset';

    const title = document.createElement('div');
    title.className = 'fieldset-title';
    title.textContent = 'Dados do motorista';
    wrap.appendChild(title);

    if (motoristas.length > 0) {
      const selectField = document.createElement('div'); selectField.className = 'field';
      const selectLabel = document.createElement('label'); selectLabel.textContent = 'Selecionar motorista cadastrado';
      const select = document.createElement('select');
      select.id = 'driverSelectCadastrado';
      select.innerHTML = '<option value="">— Selecionar —</option>' +
        motoristas.map(m => `<option value="${m.id}">${m.nome}</option>`).join('');
      select.addEventListener('change', () => preencherMotoristaSelecionado('driverSelectCadastrado'));
      selectField.appendChild(selectLabel);
      selectField.appendChild(select);
      wrap.appendChild(selectField);
    }

    const rows = [
      ['driverNomeInput', 'Nome do motorista', b.motorista ? b.motorista.nome : ''],
      ['driverTelefoneInput', 'WhatsApp do motorista', b.motorista ? b.motorista.telefone : ''],
      ['driverVeiculoInput', 'Veículo (modelo/cor)', b.motorista ? b.motorista.veiculo : ''],
      ['driverPlacaInput', 'Placa', b.motorista ? b.motorista.placa : '']
    ];

    rows.forEach(([id, label, value]) => {
      const field = document.createElement('div'); field.className = 'field';
      const l = document.createElement('label'); l.textContent = label; l.setAttribute('for', id);
      const inp = document.createElement('input'); inp.type = 'text'; inp.id = id; inp.value = value || '';
      field.appendChild(l); field.appendChild(inp);
      wrap.appendChild(field);
    });

    const valorReceberField = document.createElement('div'); valorReceberField.className = 'field';
    const valorReceberLabel = document.createElement('label'); valorReceberLabel.textContent = 'Valor a receber do cliente (R$)';
    const valorReceberInput = document.createElement('input'); valorReceberInput.type = 'number'; valorReceberInput.id = 'driverValorReceberInput';
    valorReceberInput.min = '0'; valorReceberInput.step = '0.01'; valorReceberInput.placeholder = 'R$';
    valorReceberInput.value = b.motorista && b.motorista.valorReceber ? b.motorista.valorReceber : '';
    valorReceberField.appendChild(valorReceberLabel); valorReceberField.appendChild(valorReceberInput);
    wrap.appendChild(valorReceberField);

    const valorLivreField = document.createElement('div'); valorLivreField.className = 'field';
    const valorLivreLabel = document.createElement('label'); valorLivreLabel.textContent = 'Valor livre — o que ele de fato ganha pelo trabalho (R$)';
    const valorLivreInput = document.createElement('input'); valorLivreInput.type = 'number'; valorLivreInput.id = 'driverValorLivreInput';
    valorLivreInput.min = '0'; valorLivreInput.step = '0.01'; valorLivreInput.placeholder = 'R$';
    valorLivreInput.value = b.motorista && b.motorista.valorLivre ? b.motorista.valorLivre : '';
    valorLivreField.appendChild(valorLivreLabel); valorLivreField.appendChild(valorLivreInput);
    wrap.appendChild(valorLivreField);

    const formActions = document.createElement('div'); formActions.className = 'form-actions';
    formActions.appendChild(makeButton('Salvar motorista', 'save-btn', () => saveMotorista(b.id)));
    formActions.appendChild(makeButton('Cancelar', '', cancelDriverForm));
    wrap.appendChild(formActions);

    return wrap;
  }

  function pad2(n) { return n.toString().padStart(2, '0'); }

  function toICSDateTime(dateStr, timeStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const [hh, mm] = (timeStr || '09:00').split(':').map(Number);
    return new Date(y, m - 1, d, hh, mm, 0);
  }

  function formatICS(dt) {
    return dt.getFullYear().toString() + pad2(dt.getMonth() + 1) + pad2(dt.getDate()) + 'T' + pad2(dt.getHours()) + pad2(dt.getMinutes()) + '00';
  }

  function escapeICS(str) {
    return String(str || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  }

  function buildICSEvent(uid, start, end, summary, location, description) {
    return [
      'BEGIN:VEVENT',
      `UID:${uid}`,
      `DTSTAMP:${formatICS(new Date())}`,
      `DTSTART:${formatICS(start)}`,
      `DTEND:${formatICS(end)}`,
      `SUMMARY:${escapeICS(summary)}`,
      `LOCATION:${escapeICS(location)}`,
      `DESCRIPTION:${escapeICS(description)}`,
      'BEGIN:VALARM',
      'TRIGGER:-PT60M',
      'ACTION:DISPLAY',
      'DESCRIPTION:Lembrete de transfer',
      'END:VALARM',
      'END:VEVENT'
    ].join('\r\n');
  }

  function proximoNumeroReserva() {
    let max = 0;
    bookings.forEach(x => { if (x.numeroReserva && x.numeroReserva > max) max = x.numeroReserva; });
    return max + 1;
  }

  function gerarVoucherPDF(id) {
    const b = bookings.find(x => x.id === id);
    if (!b) return;
    if (typeof window.jspdf === 'undefined') { showToast('Não foi possível carregar o gerador de PDF — confira sua internet e tente de novo.'); return; }

    if (!b.numeroReserva) {
      b.numeroReserva = proximoNumeroReserva();
      saveBookings();
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const MARGEM = 20;
    const CENTRO = pageWidth / 2;

    const PAGINA_BG = [250, 240, 212];
    const SECAO_BG = [240, 216, 155];
    const NAVY = [18, 49, 78];
    const TEXTO = [55, 45, 20];

    doc.setFillColor(...PAGINA_BG);
    doc.rect(0, 0, pageWidth, pageHeight, 'F');

    let y = 16;

    try {
      const logoEl = document.querySelector('.logo-img');
      if (logoEl && logoEl.src) {
        const logoW = 65, logoH = 26.7;
        doc.addImage(logoEl.src, 'PNG', CENTRO - logoW / 2, y, logoW, logoH);
        y += logoH;
      }
    } catch (e) { /* segue sem a logo se der algum problema */ }
    y += 8;

    doc.setDrawColor(...NAVY);
    doc.setLineWidth(0.5);
    doc.line(MARGEM + 20, y, pageWidth - MARGEM - 20, y);
    y += 10;

    doc.setFont(undefined, 'bold');
    doc.setFontSize(16);
    doc.setTextColor(...NAVY);
    doc.text('Voucher de Confirmação de Transfer', CENTRO, y, { align: 'center' });
    y += 6;

    doc.setFont(undefined, 'normal');
    doc.setFontSize(9);
    doc.setTextColor(...TEXTO);
    doc.text('Reserva Nº ' + String(b.numeroReserva).padStart(4, '0'), CENTRO, y, { align: 'center' });
    y += 10;

    doc.setFontSize(10.5);
    doc.setTextColor(...NAVY);
    doc.text(`Cliente:  ${b.nome}          WhatsApp:  ${b.telefone}`, CENTRO, y, { align: 'center' });
    y += 12;

    const TOP_PAD = 15, LINE_H = 7.2, BOTTOM_PAD = 9;

    function desenharSecao(titulo, campos) {
      const altura = TOP_PAD + (campos.length - 1) * LINE_H + BOTTOM_PAD;
      doc.setFillColor(...SECAO_BG);
      doc.roundedRect(MARGEM, y, pageWidth - 2 * MARGEM, altura, 3, 3, 'F');
      doc.setFont(undefined, 'bold');
      doc.setFontSize(11);
      doc.setTextColor(...NAVY);
      doc.text(titulo, MARGEM + 6, y + 9);
      let yy = y + TOP_PAD;
      campos.forEach(([label, valor]) => {
        doc.setFont(undefined, 'bold');
        doc.setFontSize(9.5);
        doc.setTextColor(...NAVY);
        doc.text(label + ':', MARGEM + 6, yy);
        doc.setFont(undefined, 'normal');
        doc.setTextColor(...TEXTO);
        doc.text(String(valor || '-'), MARGEM + 42, yy);
        yy += LINE_H;
      });
      y += altura + 8;
    }

    if (b.in) {
      desenharSecao('TRANSFER IN', [
        ['Data', formatDateFull(b.in.data)],
        ['Voo', b.in.voo],
        ['Horário previsto', b.in.horaChegada],
        ['Origem', b.in.origem],
        ['Destino', b.in.destino],
        ['Passageiros', b.in.passageiros]
      ]);
    }
    if (b.out) {
      desenharSecao('TRANSFER OUT', [
        ['Data', formatDateFull(b.out.data)],
        ['Origem', b.out.origem],
        ['Destino', b.out.destino],
        ['Horário de saída', b.out.horaSaida],
        ['Voo', b.out.voo],
        ['Passageiros', b.out.passageiros]
      ]);
    }

    doc.setDrawColor(...NAVY);
    doc.setLineWidth(0.5);
    doc.line(MARGEM + 20, y, pageWidth - MARGEM - 20, y);
    y += 8;

    doc.setFont(undefined, 'normal');
    doc.setFontSize(9);
    doc.setTextColor(...TEXTO);
    const linhasFechamento = config.textoFechamentoConfirmacao
      .split('\n')
      .map(l => l.trim())
      .filter(l => l.length > 0 && !l.toLowerCase().includes('motorista'));
    linhasFechamento.forEach(linha => {
      doc.text(linha, CENTRO, y, { align: 'center' });
      y += 5;
    });

    y += 6;
    doc.setFont(undefined, 'bold');
    doc.setFontSize(10.5);
    doc.setTextColor(...NAVY);
    doc.text(config.assinaturaNome, CENTRO, y, { align: 'center' });
    y += 5;
    doc.setFont(undefined, 'normal');
    doc.setFontSize(9);
    doc.text(config.assinaturaEmpresa, CENTRO, y, { align: 'center' });
    y += 5;
    doc.text('Contato: (31) 99603-3244', CENTRO, y, { align: 'center' });

    doc.save('voucher-' + b.nome.replace(/\s+/g, '-') + '.pdf');
    showToast('Voucher gerado — anexe manualmente no WhatsApp.');
  }

  function downloadICS(id) {
    const b = bookings.find(x => x.id === id);
    if (!b) return;
    const eventos = [];
    if (b.in && b.in.data) {
      const start = toICSDateTime(b.in.data, b.in.horaChegada);
      const end = new Date(start.getTime() + 60 * 60000);
      const desc = `Cliente: ${b.nome}\nTelefone: ${b.telefone}\nVoo: ${b.in.voo || 'a confirmar'}\nPassageiros: ${b.in.passageiros || ''}`;
      eventos.push(buildICSEvent(b.id + '-in@brumataxi', start, end, `BrumaTaxi - Transfer In - ${b.nome}`, `${b.in.origem} -> ${b.in.destino}`, desc));
    }
    if (b.out && b.out.data) {
      const start = toICSDateTime(b.out.data, b.out.horaSaida);
      const end = new Date(start.getTime() + 60 * 60000);
      const desc = `Cliente: ${b.nome}\nTelefone: ${b.telefone}\nVoo: ${b.out.voo || 'a confirmar'}\nPassageiros: ${b.out.passageiros || ''}`;
      eventos.push(buildICSEvent(b.id + '-out@brumataxi', start, end, `BrumaTaxi - Transfer Out - ${b.nome}`, `${b.out.origem} -> ${b.out.destino}`, desc));
    }
    if (eventos.length === 0) { showToast('Preencha ao menos uma data válida antes de gerar o evento.'); return; }
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//BrumaTaxi//Agenda//PT', 'CALSCALE:GREGORIAN', ...eventos, 'END:VCALENDAR'].join('\r\n');
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `transfer-${b.nome.replace(/\s+/g, '-')}.ics`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Arquivo gerado — abra para adicionar à sua agenda.');
  }

  function exportarRelatorioMes() {
    const now = mesVisualizado;
    const monthBookings = bookings.filter(b => {
      const dataRef = groupDate(b);
      if (!dataRef) return false;
      const d = new Date(dataRef + 'T00:00:00');
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }).sort((a, b) => sortKey(a).localeCompare(sortKey(b)));

    if (monthBookings.length === 0) { showToast('Nenhum agendamento nesse mês para exportar.'); return; }

    const linhas = [['Data', 'Cliente', 'WhatsApp', 'Tipo', 'Status', 'Forma de pagamento', 'Valor do cliente (R$)', 'Motorista', 'Valor livre do motorista (R$)', 'Lucro (R$)']];
    monthBookings.forEach(b => {
      linhas.push([
        formatDateFull(groupDate(b)),
        b.nome,
        b.telefone,
        tipoLabel(b),
        statusLabel(b.status),
        b.formaPagamento || '',
        receitaBooking(b) ? receitaBooking(b).toFixed(2).replace('.', ',') : '',
        b.motorista ? b.motorista.nome : '',
        b.motorista && b.motorista.valorLivre ? Number(b.motorista.valorLivre).toFixed(2).replace('.', ',') : '',
        b.status === 'concluido' ? lucroBooking(b).toFixed(2).replace('.', ',') : ''
      ]);
    });

    const csv = linhas.map(linha => linha.map(campo => `"${String(campo).replace(/"/g, '""')}"`).join(';')).join('\r\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `relatorio-brumataxi-${now.getFullYear()}-${pad2(now.getMonth() + 1)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Relatório exportado.');
  }

  function statusLabel(s) {
    return { pendente: 'Pendente confirmação', confirmado: 'Confirmado', concluido: 'Concluída' }[s] || s;
  }

  function tipoLabel(b) {
    if (b.in && b.out) return 'Ida e volta';
    if (b.in) return 'Somente Transfer In';
    return 'Somente Transfer Out';
  }

  function sortKey(b) {
    const data = (b.in && b.in.data) || (b.out && b.out.data) || '9999-99-99';
    const hora = (b.in && b.in.horaChegada) || (b.out && b.out.horaSaida) || '00:00';
    return data + 'T' + hora;
  }

  function groupDate(b) {
    return (b.in && b.in.data) || (b.out && b.out.data) || '';
  }

  function makeButton(label, cls, handler) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = label;
    if (cls) btn.className = cls;
    btn.addEventListener('click', handler);
    return btn;
  }

  function statCard(value, label) {
    const div = document.createElement('div'); div.className = 'stat';
    const v = document.createElement('div'); v.className = 'stat-value'; v.textContent = value;
    const l = document.createElement('div'); l.className = 'stat-label'; l.textContent = label;
    div.appendChild(v); div.appendChild(l);
    return div;
  }

  function receitaBooking(b) {
    if (b.motorista && b.motorista.valorReceber) return Number(b.motorista.valorReceber);
    return b.valor ? Number(b.valor) : 0;
  }

  function lucroBooking(b) {
    if (b.motorista && b.motorista.valorReceber && b.motorista.valorLivre) {
      return Number(b.motorista.valorReceber) - Number(b.motorista.valorLivre);
    }
    if (!b.motorista) return b.valor ? Number(b.valor) : 0;
    return 0; // tem motorista com valor a receber mas sem valor livre informado — não dá pra calcular a margem
  }

  let mesVisualizado = new Date();

  function renderStats() {
    const now = mesVisualizado;
    const monthBookings = bookings.filter(b => {
      const dataRef = groupDate(b);
      if (!dataRef) return false;
      const d = new Date(dataRef + 'T00:00:00');
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    });
    const confirmados = monthBookings.filter(b => b.status === 'confirmado' || b.status === 'concluido').length;
    const concluidas = monthBookings.filter(b => b.status === 'concluido');
    const faturamentoTotal = concluidas.reduce((s, b) => s + receitaBooking(b), 0);
    const lucro = concluidas.reduce((s, b) => s + lucroBooking(b), 0);
    const pagoMotoristas = concluidas.reduce((s, b) => s + (b.motorista && b.motorista.valorLivre ? Number(b.motorista.valorLivre) : 0), 0);
    const corridasComMotorista = monthBookings.filter(b => b.motorista).length;

    document.getElementById('mesAtualLabel').textContent = mesVisualizado.toLocaleString('pt-BR', { month: 'long', year: 'numeric' });

    const statsEl = document.getElementById('stats');
    statsEl.innerHTML = '';
    statsEl.appendChild(statCard(monthBookings.length, 'agendamentos no mês'));
    statsEl.appendChild(statCard(confirmados, 'confirmados'));
    statsEl.appendChild(statCard('R$ ' + faturamentoTotal.toFixed(2).replace('.', ','), 'faturamento total (concluídas)'));
    statsEl.appendChild(statCard('R$ ' + lucro.toFixed(2).replace('.', ','), 'lucro estimado (concluídas)'));
    statsEl.appendChild(statCard('R$ ' + pagoMotoristas.toFixed(2).replace('.', ','), 'pago a motoristas (concluídas)'));
    statsEl.appendChild(statCard(corridasComMotorista, 'corridas com motorista'));
  }

  function legLine(prefix, leg, destacarChegadaOuSaida) {
    const div = document.createElement('div'); div.className = 'card-leg';
    const horaTxt = destacarChegadaOuSaida === 'in' ? (leg.horaChegada || '--:--') : (leg.horaSaida || '--:--');
    div.innerHTML = `<b>${prefix}</b> — ${formatDateFull(leg.data) || 'data a definir'} · ${horaTxt} · voo ${leg.voo || 'a confirmar'}<br>${leg.origem || ''} → ${leg.destino || ''}${leg.passageiros ? ' · ' + leg.passageiros + ' pax' : ''}${leg.veiculo ? ' · ' + leg.veiculo : ''}`;
    return div;
  }

  function renderCard(b) {
    const card = document.createElement('div');
    card.className = 'booking-card status-' + b.status;

    const top = document.createElement('div'); top.className = 'card-top';
    const tipo = document.createElement('span'); tipo.className = 'card-tipo'; tipo.textContent = tipoLabel(b);
    const status = document.createElement('span'); status.className = 'card-status ' + b.status; status.textContent = statusLabel(b.status);
    top.appendChild(tipo); top.appendChild(status);
    card.appendChild(top);

    const client = document.createElement('div'); client.className = 'card-client'; client.textContent = b.nome;
    card.appendChild(client);

    if (b.in) card.appendChild(legLine('Transfer In', b.in, 'in'));
    if (b.out) card.appendChild(legLine('Transfer Out', b.out, 'out'));

    if (b.valor) {
      const valor = document.createElement('div'); valor.className = 'card-leg';
      valor.textContent = 'Valor: R$ ' + Number(b.valor).toFixed(2).replace('.', ',') + (b.formaPagamento ? ' · ' + b.formaPagamento : '');
      card.appendChild(valor);
    } else if (b.formaPagamento) {
      const pag = document.createElement('div'); pag.className = 'card-leg';
      pag.textContent = 'Pagamento: ' + b.formaPagamento;
      card.appendChild(pag);
    }
    if (b.obs) {
      const obs = document.createElement('div'); obs.className = 'card-obs'; obs.textContent = b.obs;
      card.appendChild(obs);
    }

    const actions = document.createElement('div'); actions.className = 'card-actions';

    if (b.status === 'pendente') {
      actions.appendChild(makeButton('Enviar confirmação', 'whatsapp-btn', () => sendWhatsApp(b.id, 'confirm')));
      actions.appendChild(makeButton('Marcar como confirmado', '', () => updateStatus(b.id, 'confirmado')));
    }
    if (b.status === 'confirmado') {
      actions.appendChild(makeButton('Reenviar confirmação', 'whatsapp-btn', () => sendWhatsApp(b.id, 'confirm')));
      actions.appendChild(makeButton('Enviar lembrete', 'whatsapp-btn', () => sendWhatsApp(b.id, 'reminder')));
      actions.appendChild(makeButton('Marcar como concluída', '', () => updateStatus(b.id, 'concluido')));
    }
    if (b.status === 'concluido' && !b.avaliacaoSolicitada) {
      actions.appendChild(makeButton('Pedir avaliação', 'whatsapp-btn', () => sendWhatsApp(b.id, 'review')));
    }
    actions.appendChild(makeButton('📄 Gerar voucher PDF', '', () => gerarVoucherPDF(b.id)));
    actions.appendChild(makeButton('📅 Adicionar à agenda', '', () => downloadICS(b.id)));
    actions.appendChild(makeButton('Editar', '', () => startEdit(b.id)));
    actions.appendChild(makeButton('Excluir', 'danger-btn', (e) => confirmDelete(b.id, e.target)));

    card.appendChild(actions);

    const driverSection = document.createElement('div');
    driverSection.className = 'driver-section';

    if (motoristaFormOpenId === b.id) {
      driverSection.appendChild(buildDriverForm(b));
    } else if (b.motorista) {
      const info = document.createElement('div'); info.className = 'card-leg';
      info.innerHTML = `<b>Motorista</b> — ${b.motorista.nome} · ${b.motorista.telefone}` +
        (b.motorista.veiculo ? ' · ' + b.motorista.veiculo : '') +
        (b.motorista.placa ? ' · placa ' + b.motorista.placa : '') +
        (b.motorista.valorReceber ? ' · R$ ' + Number(b.motorista.valorReceber).toFixed(2).replace('.', ',') + ' do cliente' : '') +
        (b.motorista.valorLivre ? ' · R$ ' + Number(b.motorista.valorLivre).toFixed(2).replace('.', ',') + ' livre' : '');
      driverSection.appendChild(info);

      const driverActions = document.createElement('div'); driverActions.className = 'card-actions';
      driverActions.appendChild(makeButton('Enviar dados ao cliente', 'whatsapp-btn', () => sendDriverInfoToClient(b.id)));
      driverActions.appendChild(makeButton('Enviar corrida ao motorista', 'whatsapp-btn', () => sendRideToDriver(b.id)));
      driverActions.appendChild(makeButton('Trocar motorista', '', () => openDriverForm(b.id)));
      driverSection.appendChild(driverActions);
    } else {
      const driverActions = document.createElement('div'); driverActions.className = 'card-actions';
      driverActions.appendChild(makeButton('Atribuir motorista', '', () => openDriverForm(b.id)));
      driverSection.appendChild(driverActions);
    }

    card.appendChild(driverSection);

    const hint = document.createElement('div'); hint.className = 'card-hint';
    hint.textContent = 'O botão abre o WhatsApp com a mensagem pronta — só falta apertar enviar.';
    card.appendChild(hint);

    return card;
  }

  let filtroTexto = '';

  function bateComFiltro(b) {
    if (!filtroTexto) return true;
    const alvo = (b.nome + ' ' + b.telefone).toLowerCase();
    return alvo.includes(filtroTexto.toLowerCase());
  }

  function render() {
    renderStats();

    const active = bookings.filter(b => b.status !== 'concluido' && bateComFiltro(b)).sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
    const done = bookings.filter(b => b.status === 'concluido' && bateComFiltro(b)).sort((a, b) => sortKey(b).localeCompare(sortKey(a)));

    const agendaList = document.getElementById('agendaList');
    agendaList.innerHTML = '';
    if (active.length === 0) {
      agendaList.innerHTML = filtroTexto ? '<div class="empty-state">Nenhum resultado para essa busca.</div>' : '<div class="empty-state">Nenhum transfer agendado ainda. Toque em "Novo agendamento" para começar.</div>';
    } else {
      let lastDate = null;
      active.forEach(b => {
        const gd = groupDate(b);
        if (gd !== lastDate) {
          const label = document.createElement('div');
          label.className = 'date-group-label';
          label.textContent = formatDateLabel(gd);
          agendaList.appendChild(label);
          lastDate = gd;
        }
        agendaList.appendChild(renderCard(b));
      });
    }

    const doneSection = document.getElementById('doneSection');
    const doneList = document.getElementById('doneList');
    if (done.length > 0) {
      doneSection.classList.remove('hidden');
      doneList.innerHTML = '';
      done.forEach(b => doneList.appendChild(renderCard(b)));
    } else {
      doneSection.classList.add('hidden');
    }
  }

  function sendWhatsApp(id, type) {
    const b = bookings.find(x => x.id === id);
    if (!b) return;
    let msg;
    if (type === 'confirm') { msg = buildTransferMessage(b); b.confirmacaoEnviada = true; b.status = 'confirmado'; }
    else if (type === 'reminder') { msg = reminderMessage(b); b.lembreteEnviado = true; }
    else { msg = reviewMessage(b); b.avaliacaoSolicitada = true; }
    window.open(buildWhatsAppLink(b, msg), '_blank');
    saveBookings();
    render();
  }

  function updateStatus(id, status) {
    const b = bookings.find(x => x.id === id);
    if (!b) return;
    b.status = status;
    saveBookings();
    render();
    showToast(status === 'confirmado' ? 'Marcado como confirmado.' : 'Transfer concluído!');
  }

  function setTipo(tipo, silentForm) {
    tipoSelecionado = tipo;
    document.querySelectorAll('.tipo-pill').forEach(p => p.classList.toggle('active', p.dataset.tipo === tipo));
    document.getElementById('fieldsetIn').classList.toggle('hidden', tipo === 'out');
    document.getElementById('fieldsetOut').classList.toggle('hidden', tipo === 'in');
  }

  document.querySelectorAll('.tipo-pill').forEach(pill => {
    pill.addEventListener('click', () => setTipo(pill.dataset.tipo));
  });

  let pagamentoSelecionado = '';
  document.querySelectorAll('.pagamento-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      pagamentoSelecionado = pill.dataset.pagamento;
      document.querySelectorAll('.pagamento-pill').forEach(p => p.classList.toggle('active', p === pill));
    });

  function dataBRParaISO(str) {
    if (!str) return '';
    const m = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (!m) return '';
    return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  }

  function parseReservaTexto(texto) {
    const linhas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    let secao = null;
    const result = { nome: '', telefone: '', obs: '', formaPagamento: '', in: null, out: null };

    function garanteIn() { if (!result.in) result.in = { data: '', voo: '', horaChegada: '', origem: '', destino: '', passageiros: '' }; return result.in; }
    function garanteOut() { if (!result.out) result.out = { data: '', voo: '', horaSaida: '', origem: '', destino: '', passageiros: '' }; return result.out; }

    linhas.forEach(linha => {
      const semAsteriscos = linha.replace(/\*/g, '');
      const lower = semAsteriscos.toLowerCase();
      if (lower.includes('transfer in')) { secao = 'in'; return; }
      if (lower.includes('transfer out')) { secao = 'out'; return; }

      const match = semAsteriscos.match(/^([^:]+):\s*(.*)$/);
      if (!match) return;
      const valor = match[2].trim();
      const chave = match[1].trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

      if (chave.includes('cliente')) { result.nome = valor; return; }
      if (chave.includes('whatsapp')) { result.telefone = valor; return; }
      if (chave.includes('observ')) { result.obs = valor; return; }
      if (chave.includes('forma de pagamento')) { result.formaPagamento = valor; return; }
      if (chave.includes('horario previsto de chegada')) { garanteIn().horaChegada = valor; return; }
      if (chave.includes('horario de saida')) { garanteOut().horaSaida = valor; return; }
      if (chave === 'data') { if (secao === 'in') garanteIn().data = valor; else if (secao === 'out') garanteOut().data = valor; return; }
      if (chave === 'voo') { if (secao === 'in') garanteIn().voo = valor; else if (secao === 'out') garanteOut().voo = valor; return; }
      if (chave === 'origem') { if (secao === 'in') garanteIn().origem = valor; else if (secao === 'out') garanteOut().origem = valor; return; }
      if (chave === 'destino') { if (secao === 'in') garanteIn().destino = valor; else if (secao === 'out') garanteOut().destino = valor; return; }
      if (chave === 'passageiros') { if (secao === 'in') garanteIn().passageiros = valor; else if (secao === 'out') garanteOut().passageiros = valor; return; }
    });

    return result;
  }

  function importarReserva() {
    const texto = document.getElementById('pasteReservaInput').value;
    if (!texto.trim()) { showToast('Cole o texto da reserva recebida antes de importar.'); return; }

    const dados = parseReservaTexto(texto);
    if (!dados.nome && !dados.telefone) {
      showToast('Não consegui identificar os dados dessa mensagem. Confira se colou o texto completo.');
      return;
    }

    editingId = null;
    document.getElementById('submitBtn').textContent = 'Salvar agendamento';
    document.getElementById('cancelEditBtn').classList.add('hidden');

    document.getElementById('bookingForm').classList.remove('hidden');
    document.getElementById('toggleFormBtn').textContent = 'Fechar formulário';

    document.getElementById('nome').value = dados.nome;
    document.getElementById('telefone').value = dados.telefone;

    const tipo = dados.in && dados.out ? 'both' : (dados.in ? 'in' : 'out');
    setTipo(tipo);

    if (dados.in) {
      document.getElementById('inData').value = dataBRParaISO(dados.in.data);
      document.getElementById('inVoo').value = dados.in.voo || '';
      document.getElementById('inHora').value = dados.in.horaChegada || '';
      document.getElementById('inOrigem').value = dados.in.origem || 'Aeroporto de Confins (CNF)';
      document.getElementById('inDestino').value = dados.in.destino || 'Clara Arte Resort';
      document.getElementById('inPassageiros').value = dados.in.passageiros || '';
    }
    if (dados.out) {
      document.getElementById('outData').value = dataBRParaISO(dados.out.data);
      document.getElementById('outOrigem').value = dados.out.origem || 'Clara Arte Resort';
      document.getElementById('outDestino').value = dados.out.destino || 'Aeroporto de Confins (CNF)';
      document.getElementById('outHora').value = dados.out.horaSaida || '';
      document.getElementById('outVoo').value = dados.out.voo || '';
      document.getElementById('outPassageiros').value = dados.out.passageiros || '';
    }
    document.getElementById('obs').value = dados.obs || '';
    pagamentoSelecionado = dados.formaPagamento || '';
    document.querySelectorAll('.pagamento-pill').forEach(p => p.classList.toggle('active', p.dataset.pagamento === pagamentoSelecionado));

    document.getElementById('pasteReservaInput').value = '';
    document.getElementById('pastePanel').classList.add('hidden');
    document.getElementById('bookingForm').scrollIntoView({ behavior: 'smooth' });
    showToast('Dados identificados! Revise e clique em "Salvar agendamento".');
  }

  function startEdit(id) {
    const b = bookings.find(x => x.id === id);
    if (!b) return;
    editingId = id;
    document.getElementById('nome').value = b.nome;
    document.getElementById('telefone').value = b.telefone;

    const tipo = b.in && b.out ? 'both' : (b.in ? 'in' : 'out');
    setTipo(tipo);

    if (b.in) {
      document.getElementById('inData').value = b.in.data || '';
      document.getElementById('inVoo').value = b.in.voo || '';
      document.getElementById('inHora').value = b.in.horaChegada || '';
      document.getElementById('inOrigem').value = b.in.origem || 'Aeroporto de Confins (CNF)';
      document.getElementById('inDestino').value = b.in.destino || 'Clara Arte Resort';
      document.getElementById('inPassageiros').value = b.in.passageiros || '';
      document.getElementById('inVeiculo').value = b.in.veiculo || '';
    }
    if (b.out) {
      document.getElementById('outData').value = b.out.data || '';
      document.getElementById('outOrigem').value = b.out.origem || 'Clara Arte Resort';
      document.getElementById('outDestino').value = b.out.destino || 'Aeroporto de Confins (CNF)';
      document.getElementById('outHora').value = b.out.horaSaida || '';
      document.getElementById('outVoo').value = b.out.voo || '';
      document.getElementById('outPassageiros').value = b.out.passageiros || '';
      document.getElementById('outVeiculo').value = b.out.veiculo || '';
    }
    document.getElementById('valor').value = b.valor || '';
    document.getElementById('obs').value = b.obs || '';
    pagamentoSelecionado = b.formaPagamento || '';
    document.querySelectorAll('.pagamento-pill').forEach(p => p.classList.toggle('active', p.dataset.pagamento === pagamentoSelecionado));

    document.getElementById('submitBtn').textContent = 'Salvar alterações';
    document.getElementById('cancelEditBtn').classList.remove('hidden');
    document.getElementById('bookingForm').classList.remove('hidden');
    document.getElementById('toggleFormBtn').textContent = 'Fechar formulário';
    document.getElementById('bookingForm').scrollIntoView({ behavior: 'smooth' });
  }

  function confirmDelete(id, btn) {
    if (btn.textContent !== 'Confirmar exclusão?') {
      btn.textContent = 'Confirmar exclusão?';
      setTimeout(() => { if (btn.textContent === 'Confirmar exclusão?') btn.textContent = 'Excluir'; }, 3000);
    } else {
      bookings = bookings.filter(x => x.id !== id);
      saveBookings();
      render();
      showToast('Agendamento excluído.');
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(window.__toastTimeout);
    window.__toastTimeout = setTimeout(() => t.classList.add('hidden'), 2800);
  }

  document.getElementById('toggleFormBtn').addEventListener('click', () => {
    const form = document.getElementById('bookingForm');
    const willShow = form.classList.contains('hidden');
    form.classList.toggle('hidden');
    document.getElementById('toggleFormBtn').textContent = willShow ? 'Fechar formulário' : '+ Novo agendamento';
  });

  document.getElementById('toggleDoneBtn').addEventListener('click', () => {
    const list = document.getElementById('doneList');
    list.classList.toggle('hidden');
    document.getElementById('toggleDoneBtn').textContent = list.classList.contains('hidden') ? 'Corridas concluídas ▾' : 'Corridas concluídas ▴';
  });

  document.getElementById('cancelEditBtn').addEventListener('click', () => {
    editingId = null;
    document.getElementById('bookingForm').reset();
    setTipo('both');
    pagamentoSelecionado = '';
    document.querySelectorAll('.pagamento-pill').forEach(p => p.classList.remove('active'));
    document.getElementById('inOrigem').value = 'Aeroporto de Confins (CNF)';
    document.getElementById('inDestino').value = 'Clara Arte Resort';
    document.getElementById('outOrigem').value = 'Clara Arte Resort';
    document.getElementById('outDestino').value = 'Aeroporto de Confins (CNF)';
    document.getElementById('submitBtn').textContent = 'Salvar agendamento';
    document.getElementById('cancelEditBtn').classList.add('hidden');
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (this.textContent === 'Apagar todos os dados') {
      this.textContent = 'Tem certeza? Toque de novo para confirmar';
      setTimeout(() => { if (this.textContent !== 'Apagar todos os dados') this.textContent = 'Apagar todos os dados'; }, 4000);
    } else {
      bookings = [];
      saveBookings();
      render();
      this.textContent = 'Apagar todos os dados';
      showToast('Todos os dados foram apagados.');
    }
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(bookings, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'brumataxi-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Backup exportado.');
  });

  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });

  document.getElementById('importFile').addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (evt) {
      try {
        const imported = JSON.parse(evt.target.result);
        if (!Array.isArray(imported)) throw new Error('formato inválido');
        bookings = imported;
        saveBookings();
        render();
        showToast('Backup importado com sucesso.');
      } catch (err) {
        showToast('Não foi possível ler esse arquivo de backup.');
      }
    };
    reader.readAsText(file);
    this.value = '';
  });

  document.getElementById('bookingForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const nome = document.getElementById('nome').value.trim();
    const telefone = document.getElementById('telefone').value.trim();
    const valor = document.getElementById('valor').value;
    const obs = document.getElementById('obs').value.trim();
    const formaPagamento = pagamentoSelecionado;

    if (!nome || !telefone) { showToast('Preencha cliente e WhatsApp.'); return; }

    let inLeg = null, outLeg = null;

    if (tipoSelecionado === 'in' || tipoSelecionado === 'both') {
      const inData = document.getElementById('inData').value;
      if (!inData) { showToast('Preencha a data do Transfer In.'); return; }
      inLeg = {
        data: inData,
        voo: document.getElementById('inVoo').value.trim(),
        horaChegada: document.getElementById('inHora').value,
        origem: document.getElementById('inOrigem').value.trim(),
        destino: document.getElementById('inDestino').value.trim(),
        passageiros: document.getElementById('inPassageiros').value.trim(),
        veiculo: document.getElementById('inVeiculo').value.trim()
      };
    }
    if (tipoSelecionado === 'out' || tipoSelecionado === 'both') {
      const outData = document.getElementById('outData').value;
      if (!outData) { showToast('Preencha a data do Transfer Out.'); return; }
      outLeg = {
        data: outData,
        origem: document.getElementById('outOrigem').value.trim(),
        destino: document.getElementById('outDestino').value.trim(),
        horaSaida: document.getElementById('outHora').value,
        voo: document.getElementById('outVoo').value.trim(),
        passageiros: document.getElementById('outPassageiros').value.trim(),
        veiculo: document.getElementById('outVeiculo').value.trim()
      };
    }

    if (editingId) {
      const b = bookings.find(x => x.id === editingId);
      Object.assign(b, { nome, telefone, in: inLeg, out: outLeg, valor, obs, formaPagamento });
      editingId = null;
      document.getElementById('submitBtn').textContent = 'Salvar agendamento';
      document.getElementById('cancelEditBtn').classList.add('hidden');
      showToast('Agendamento atualizado.');
    } else {
      bookings.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        nome, telefone, in: inLeg, out: outLeg, valor, obs, formaPagamento,
        status: 'pendente', motorista: null,
        confirmacaoEnviada: false, lembreteEnviado: false, avaliacaoSolicitada: false,
        criadoEm: new Date().toISOString()
      });
      showToast('Agendamento salvo!');
    }

    saveBookings();
    render();
    this.reset();
    setTipo('both');
    pagamentoSelecionado = '';
    document.querySelectorAll('.pagamento-pill').forEach(p => p.classList.remove('active'));
    document.getElementById('inOrigem').value = 'Aeroporto de Confins (CNF)';
    document.getElementById('inDestino').value = 'Clara Arte Resort';
    document.getElementById('outOrigem').value = 'Clara Arte Resort';
    document.getElementById('outDestino').value = 'Aeroporto de Confins (CNF)';
    document.getElementById('bookingForm').classList.add('hidden');
    document.getElementById('toggleFormBtn').textContent = '+ Novo agendamento';
  });

  document.getElementById('toggleDriversBtn').addEventListener('click', () => {
    document.getElementById('driversPanel').classList.toggle('hidden');
  });

  document.getElementById('addMotoristaBtn').addEventListener('click', addMotoristaCadastro);

  document.getElementById('togglePasteBtn').addEventListener('click', () => {
    document.getElementById('pastePanel').classList.toggle('hidden');
  });

  document.getElementById('importarReservaBtn').addEventListener('click', importarReserva);

  document.getElementById('toggleSettingsBtn').addEventListener('click', () => {
    document.getElementById('settingsPanel').classList.toggle('hidden');
  });

  document.getElementById('saveSettingsBtn').addEventListener('click', saveConfig);
  document.getElementById('syncAgoraBtn').addEventListener('click', () => carregarDaNuvem(true));

  document.getElementById('mesAnteriorBtn').addEventListener('click', () => {
    mesVisualizado = new Date(mesVisualizado.getFullYear(), mesVisualizado.getMonth() - 1, 1);
    renderStats();
  });
  document.getElementById('mesProximoBtn').addEventListener('click', () => {
    mesVisualizado = new Date(mesVisualizado.getFullYear(), mesVisualizado.getMonth() + 1, 1);
    renderStats();
  });

  document.getElementById('exportarRelatorioBtn').addEventListener('click', exportarRelatorioMes);

  document.getElementById('buscaCliente').addEventListener('input', (e) => {
    filtroTexto = e.target.value;
    render();
  });

  async function iniciar() {
    setTipo('both');
    loadConfig();
    loadMotoristas();
    loadBookings();
    if (scriptURL) {
      await carregarDaNuvem(false);
    }
  }
  iniciar();
</script>
